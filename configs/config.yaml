paths:
  upfd_politifact_root: "datasets/politifact"
  upfd_gossipcop_root: "datasets/gossipcop"
  checkpoint_dir: "results/checkpoints"

training:
  batch_size: 64
  hidden_dim: 64
  dropout: 0.5
  lr: 5.0e-4
  weight_decay: 5.0e-4
  max_epochs: 120
  patience: 15
  lr_scheduler_patience: 4
  lr_scheduler_factor: 0.5
  grad_clip_norm: 1.0
  use_amp: true
  seed: 42
  label_noise: 0.07
  baseline_label_noise: 0.15
  # Windows uses spawn-based multiprocessing — set to 0 for faster PyG loading.
  num_workers: 0

split:
  test_size: 0.2
  val_size: 0.1
  random_state: 42
